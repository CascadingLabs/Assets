<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cascading Labs light Zoom background</title>
  <desc id="desc">A subtle monochrome light background with an understated Cascading Labs periodic-table mark in the upper-right corner.</desc>
  <defs>
    <radialGradient id="warm-glow" cx="100%" cy="0%" r="100%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="0.42" stop-color="#f5f5f5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f5f5f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f5f5"/>
      <stop offset="0.58" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#warm-glow)"/>
  <circle cx="1650" cy="160" r="245" fill="#000000" opacity="0.035" filter="url(#soft-glow)"/>

  <g transform="translate(1450 70) scale(0.72)" fill="#000000">
    <text x="250" y="310" font-family="Inter, system-ui, sans-serif" font-size="200" font-weight="800" opacity="0.68" text-anchor="middle">Cl</text>
    <text x="250" y="382" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="400" opacity="0.48" text-anchor="middle" letter-spacing="3">Cascading Labs</text>
  </g>

  <path d="M0 1018 C470 970 835 1044 1260 1008 C1510 987 1720 948 1920 958 L1920 1080 L0 1080 Z" fill="#000000" opacity="0.025"/>
</svg>
